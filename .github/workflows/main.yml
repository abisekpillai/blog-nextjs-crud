name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files
        run: |
          mkdir -p /home/abisek/blog-nextjs-crud
          rsync -a --delete \
            --exclude='.env' \
            ./ /home/abisek/blog-nextjs-crud/

      - name: Copy environment
        run: |
          cp /opt/.env /home/abisek/blog-nextjs-crud/.env

      - name: Build Docker image
        working-directory: /home/abisek/blog-nextjs-crud
        run: docker build -t blog-nextjs-crud .

      - name: Stop existing container
        run: docker rm -f nextjs || true

      - name: Start container
        run: |
          docker run -d \
            --name nextjs \
            --network nextjs-network \
            --env-file /home/abisek/blog-nextjs-crud/.env \
            -p 3000:3000 \
            blog-nextjs-crud

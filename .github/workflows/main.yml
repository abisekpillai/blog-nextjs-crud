name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_DIR: /home/abisek/blog-nextjs-crud
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # -----------------------------
      # Deploy source code
      # -----------------------------
      - name: Deploy source
        run: |
          mkdir -p "$APP_DIR"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            "$GITHUB_WORKSPACE/" \
            "$APP_DIR/"

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      # -----------------------------
      # Lint
      # -----------------------------
      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      # -----------------------------
      # Build Next.js
      # -----------------------------
      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      # -----------------------------
      # Restart application
      # -----------------------------
      - name: Restart application
        working-directory: ${{ env.APP_DIR }}
        run: |
          if pm2 describe blog-nextjs-crud > /dev/null 2>&1; then
            pm2 restart blog-nextjs-crud
          else
            pm2 start npm \
              --name blog-nextjs-crud \
              -- start
          fi

          pm2 save

      # -----------------------------
      # Verify application
      # -----------------------------
      - name: Application status
        run: pm2 status

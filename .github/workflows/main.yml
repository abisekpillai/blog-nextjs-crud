name: Build WF

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          cp -r . /opt/blog-nextjs-crud/
          cp /opt/.env /opt/blog-nextjs-crud/.env

          cd /opt/blog-nextjs-crud

          npm ci
          npx prisma generate
          npm run build

      - name: Restart application
        run: |
          cd /opt/blog-nextjs-crud
          npm run start

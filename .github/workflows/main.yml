name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /home/abisek/blog-nextjs-crud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Deploy files
        working-directory: /home/abisek
        run: |
          mkdir -p blog-nextjs-crud
          rsync -a --delete \
            --exclude='.env' \
            "$GITHUB_WORKSPACE/" \
            blog-nextjs-crud/

      - name: Copy environment
        run: cp /opt/.env .env

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

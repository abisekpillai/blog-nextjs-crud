name: Build & Deploy

on:
  workflow_dispatch:

env:
  APP_DIR: /home/abisek/blog-nextjs-crud

jobs:
  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy source
        run: |
          mkdir -p "$APP_DIR"

          rsync -a --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            "$GITHUB_WORKSPACE/" \
            "$APP_DIR/"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Dependency audit
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: npm audit --audit-level=critical

      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

      - name: Type check
        working-directory: ${{ env.APP_DIR }}
        run: npx tsc --noEmit

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

  # ==================================================
  # Deploy
  # ==================================================
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build

    # This job is a deployment to the "dev" environment.
    # Secrets referenced by this job come from the
    # GitHub "dev" environment.
    environment:
      name: dev

    steps:
      - name: Restart application
        working-directory: ${{ env.APP_DIR }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if pm2 describe blog-nextjs-crud > /dev/null 2>&1; then
            pm2 restart blog-nextjs-crud
          else
            pm2 start npm \
              --name blog-nextjs-crud \
              -- start
          fi

          pm2 save

  # ==================================================
  # Verify
  # ==================================================
  verify:
    name: Verify
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: Application status
        run: pm2 status
